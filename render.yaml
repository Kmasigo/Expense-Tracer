
services:
  - type: web
    name: expense-tracer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash -lc 'export FLET_FORCE_WEB_SERVER=true; export FLET_SERVER_PORT=${PORT:-10000}; python main.py'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
